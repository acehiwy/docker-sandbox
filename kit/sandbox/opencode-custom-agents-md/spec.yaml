schemaVersion: "1"
kind: sandbox
name: opencode-custom-agents-md
displayName: opencode custom agents.md
description: |
  Opencode agent with custom AGENTS.md file injected. 
  At the time of writing, 18 July 2026, Docker sandbox does not support overriding aiFile created by Docker sandbox.

sandbox:
  image: "docker/sandbox-templates:opencode-docker"
  entrypoint:
    run: [opencode]

network:
  allowedDomains:
    - opencode.ai
    - mcp.exa.ai # for web search tool
  serviceDomains:
    opencode.ai: opencode-service-id
  serviceAuth:
    opencode-service-id:
      headerName: Authorization
      valueFormat: "Bearer %s"


commands:
  install:
    - description: Write custom AGENTS.md
      command: |
        curl -fsSL https://raw.githubusercontent.com/acehiwy/docker-sandbox/refs/heads/main/kit/overridden-default-agents.md -o ~/.config/opencode/AGENTS.md
      user: "1000"
      
